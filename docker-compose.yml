version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dstill-postgres
    environment:
      POSTGRES_USER: dstill
      POSTGRES_PASSWORD: dstill_dev_password
      POSTGRES_DB: dstill_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dstill-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: